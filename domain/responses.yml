  utter_explain:
  - text: "Great! We provide voice assistants that can work in various aspects of your business, including customer service, sales, HR, vendor management. Our voice assistants can cold call your leads, act as your brand's customer service reps, interact with your vendors and even conduct the first round of screening interviews. Our AI model can be trained and deployed in your company's cloud environment in a matter of 2 hours and the best part is.....it integrates with your CRM. I know you might have questions like 'How much does your solution cost? Will it be affordable for me, Will my data be safe with it? Can I work 24x7 for me?' Let me tell you this, it will work day, night, noon whatever shift you want it to work on! Add the data is end to end encrypted and the software will be hosted on your platform so nobody is touching your data. And I can guarantee that after a month of implementation you'll tell me how much costs have you saved! How does this sound?"
  - text: "Great! We offer advanced voice assistants designed to enhance various aspects of your business, from customer service and sales to HR and vendor management. Our voice assistants can seamlessly cold call your leads, represent your brand in customer service interactions, communicate with vendors, and even conduct initial screening interviews. The standout feature? Our AI models can be trained and deployed in your company's cloud environment in just two hours. Plus, our solution integrates smoothly with your CRM. You might be wondering about costs, affordability, data security, and availability. Here's the best part: our voice assistants work around the clock—day, night, or any shift you require. Your data's security is our priority, with end-to-end encryption and hosting on your platform, ensuring total control and privacy. And after a month of implementation, you'll likely be thrilled with the cost savings! How does this sound to you?"
  - text: "Great! We specialize in providing voice assistants that can revolutionize your business operations. Whether it's customer service, sales, HR, or vendor management, our voice assistants have you covered. They can cold call leads, handle customer service tasks, interact with vendors, and even conduct first-round interviews. Our AI models can be up and running in your cloud environment in just two hours and integrate perfectly with your CRM. Now, I'm sure you have questions like: 'How much will this cost? Will it fit my budget? Is my data secure? Can it operate 24/7?' Rest assured, our solution is not only affordable but also incredibly efficient. It can operate anytime you need, with end-to-end encrypted data hosted on your platform, ensuring complete security. I'm confident that within a month, you'll see significant cost savings. What do you think?"

  utter_schedule_call:
  - text: "Yes, but we all know how easy it is to get lost under a pile of emails. How about I schedule a demo call with you so you can look at our assistants more closely? I will get my human too on that call, what do you say?"

  utter_request_demo_call:
